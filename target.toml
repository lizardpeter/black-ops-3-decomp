# What this repo reverses. Originals are never committed; they live in R2 under these keys
# and every tool verifies the sha256 before use.

project = "t7"
title = "Call of Duty: Black Ops III (PC, x64)"
graph = "re_t7"
r2_public = "https://r2.houseofkublai.com/"
ghidra = "12.1.4"
# Compiler: confirm from each exe's Rich header and debug directory during the build inventory.
compiler = "Store build: VS2019 16.11 (cl 19.29.30154, linker 14.29), x64, LTCG (POGO debug record). Original 2015 PC builds: to confirm"
# Original source roots, for turning PDB/MAP paths into repo paths (tools/pdb/extract.py). Filled in from the
# reference build's PDB.
source_roots = []

# kind: "retail"    = the final target (the build the user names; usually the final retail exe).
#       "reference" = has symbols (PDB and/or MAP): the build reconstructed first and matched to the target.
#       "related"   = no symbols, but helpful (other platforms or versions, community-named builds).
# `analyze = true` puts a build in the next Ghidra pipeline run (.github/workflows/ghidra.yml); a manual run can
# name any builds instead.
#
# `protection = "arxan"`: the code is encrypted on disk and decrypted by the entry stub at startup.
# tools/unpack/arxan.py (from ghosts-decomp) emulates that stub; it may need adapting for this game's stub.
# `unpacked_sha256` pins the result, so the unpacked image is reproducible from the original.
#
# Each build gets an entry here once it is hashed and its provenance recorded (docs/builds.md). More files are
# still being uploaded to R2.

# Microsoft Store (GDK) build, package 38985CA0.CallofDutyBlackOps3PCMS 0.2.4.0. One exe for every mode. Rebuilt with
# VS2019 16.11 in d:\workspace\outrun\t7 (the same port tree as Ghosts' Store build). No Arxan: .text is plaintext and
# the entry point is in it. No symbols. Final target unless the user names another.
[[build]]
id = "BlackOps3_MSStore"
kind = "retail"
analyze = false  # analysed (analysis/BlackOps3_MSStore); set true only to redo it
timestamp = "2024-11-14T18:19:22Z"
original_name = "BlackOps3.exe"
pdb_path = 'd:\workspace\outrun\t7\game\pc\BlackOps3.pdb'
pdb_guid = "BFD3A67B-5182-473D-B955-12F61FDB5F43"
pdb_age = 5
exe = { key = "bo3/DUMP/BlackOps3.exe", sha256 = "72c8a21763adbfac9e1b2bcd6f93b05ecf437610e16430d99a1680ea0f827c17" }

# Final Steam build (2023-02-25), as distributed in a torrent copy (R2 folder t7_tor_exe). Activision Authenticode
# digest matches: an unmodified original. Arxan-protected: both .text sections are encrypted on disk (entropy 8.0).
# VS2012 (linker 11.0). Its PDB path names the original tree (Q:\t7\pc). Related helper: the community BO3 clients
# name addresses in this build, and those names can be carried to the Store build by matching.
[[build]]
id = "BlackOps3_Steam"
kind = "related"
analyze = true
protection = "arxan"
timestamp = "2023-02-25T01:02:52Z"
original_name = "BlackOps3.exe"
pdb_path = 'Q:\t7\pc\game\pc\cod_Ship.pdb'
pdb_guid = "97E5A5DF-999E-4983-B5DD-03ECE1D43B07"
pdb_age = 215
exe = { key = "bo3/t7_tor_exe/BlackOps3.exe", sha256 = "66b95eb4667bd5b3b3d230e7bed1d29ccd261d48ca2699f01216c863be24ff44" }
# tools/unpack/arxan.py output (~7 min): both .text sections, .interpr, .rdata, .data and _RDATA decrypted
unpacked_sha256 = "0e0536473742a5841ce09c48725c2fd039bffb717603c4c4ed0f8e511c5815b9"
